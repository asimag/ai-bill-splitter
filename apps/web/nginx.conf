server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite fingerprints bundle filenames, so those can be cached hard. index.html
  # must never be reused from cache, or a deploy leaves browsers pointing at
  # superseded asset hashes.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # SPA routing
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }

  # API + receipts (Stage 3) stay behind this same origin; HTTPS is terminated
  # by the reverse proxy in front of this container.
  location /api {
    # Receipt uploads allow RECEIPT_MAX_BYTES=10MB on the API; nginx's default
    # 1m would reject them before the API ever sees the file. 12m leaves room
    # for multipart boundaries and form fields on top of a 10 MB image.
    client_max_body_size 12m;
    proxy_pass http://server:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
