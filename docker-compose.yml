# Self-hosted stack: PostgreSQL + API + web.
# NOTE: authored but not yet verified — the development Mac has no Docker engine
# (as of 2026-11-03). Verify with `docker compose up` on the target server.
# Put SESSION_SECRET (and optional Stage-3 receipt-AI settings) in a local .env.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: billsplit
      POSTGRES_USER: billsplit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U billsplit']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped # survive restarts/crashes; queued receipt jobs are re-queued on boot
    environment:
      PORT: '8787'
      DATABASE_URL: postgres://billsplit:${POSTGRES_PASSWORD}@db:5432/billsplit
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      CREDENTIALS_SECRET: ${CREDENTIALS_SECRET:?set CREDENTIALS_SECRET in .env (encrypts saved API keys)}
      PROD: 'true'
      # Registration is closed by default: open it (ALLOW_REGISTRATION=true),
      # create the organizer accounts, then close it again so strangers cannot
      # consume this server's receipt-AI quota.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      # Stage 3 — receipt AI (see .env.example for docs):
      RECEIPT_AI_MODE: ${RECEIPT_AI_MODE:-auto}
      # LOCAL_AI_BASE_URL must be reachable *from this container* — e.g.
      # http://host.docker.internal:11234/v1 for a vision server on the host,
      # or a LAN IP. "localhost" here would mean this container.
      LOCAL_AI_BASE_URL: ${LOCAL_AI_BASE_URL:-}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-}
      LOCAL_AI_API_KEY: ${LOCAL_AI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RECEIPT_AI_TIMEOUT_MS: ${RECEIPT_AI_TIMEOUT_MS:-30000}
      RECEIPT_STORAGE_DIR: /data/receipts
    volumes:
      - receipts:/data/receipts # private storage, outside any web root
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '8787'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8787/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # Serve behind your HTTPS reverse proxy (Caddy/nginx/Traefik) in front of this port.
      - '127.0.0.1:8090:80'
    depends_on:
      - server

volumes:
  pgdata:
  receipts:
